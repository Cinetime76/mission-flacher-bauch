<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Mission Flacher Bauch</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#111b21;background:#f7f8f4}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:500px;margin:auto;min-height:100dvh;padding-bottom:95px;background:#f8f9f6}.hero{height:196px;background:radial-gradient(circle at 50% -35%,#306a53,#053728 70%);color:white;text-align:center;padding:29px 16px 20px}.hero strong{display:block;font-size:24px;line-height:1.02;letter-spacing:-.5px}.hero strong span{color:#79ef62}.hero em{font-family:Georgia,serif;font-size:16px}.hero .gear{position:absolute;right:24px;top:48px;background:none;border:0;color:white;font-size:24px}.main{padding:0 13px}.panel{background:white;border:1px solid #ebede7;border-radius:18px;box-shadow:0 3px 14px #13271a0a;padding:15px;margin:12px 0}.today{margin-top:-22px;position:relative;padding:14px}.todayhead{display:flex;justify-content:space-between;align-items:start}.today h2{margin:0;font-size:19px}.today p{margin:4px 0 8px;color:#7c8480;font-size:12px}.check{background:#0c9b37;border:0;color:white;border-radius:50%;width:37px;height:37px;font-size:22px;box-shadow:0 3px 7px #118e3e55}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.day{border:0;background:transparent;border-radius:25px;min-width:0;padding:6px 0;font-size:12px}.day small{display:block;color:#858b87;font-size:10px;margin-bottom:6px}.day.active{background:#0e9c38;color:white;font-weight:700}.day.active small{color:#e8ffe8}.panel h3{margin:0 0 13px;font-size:17px}.rings{display:flex;justify-content:space-around;gap:7px}.ring{--pct:0%;--clr:#129a3d;width:30%;max-width:115px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--clr) var(--pct),#e8eae8 0);padding:6px;display:grid;place-items:center}.ringin{width:100%;height:100%;border-radius:50%;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center}.ringin .emoji{font-size:18px}.ringin b{font-size:19px;line-height:1.2}.ringin small{font-size:10px;color:#737a79;text-align:center}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.action{border:0;border-radius:13px;padding:11px 2px 9px;min-height:84px;font-size:11px;line-height:1.25}.action span{display:block;font-size:24px;margin-bottom:7px}.action:nth-child(1){background:#edf9ee}.action:nth-child(2){background:#eaf5ff}.action:nth-child(3){background:#fff3e8}.action:nth-child(4){background:#f1ecff}.goalhead{display:flex;justify-content:space-between;font-size:15px;font-weight:700}.sub{font-size:12px;color:#69736c;margin:7px 0}.bar{height:9px;border-radius:15px;background:#e9ece8;overflow:hidden;margin:14px 0 11px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#008c35,#75e568);border-radius:15px}.task{font-size:12px;margin:8px 0}.task b{display:inline-grid;place-items:center;background:#0b9d39;color:white;border-radius:50%;width:18px;height:18px;margin-right:6px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:500px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #e6eae6;padding:9px 0 max(9px,env(safe-area-inset-bottom));z-index:20}.nav button{border:0;background:none;color:#7b8580;font-size:10px}.nav button span{display:block;font-size:20px;margin-bottom:3px}.nav button.on{color:#008e33;font-weight:700}.screen{padding:16px 13px}.screen h1{text-align:center;font-size:21px;margin:4px 0 15px}.topline{display:flex;align-items:center;justify-content:space-between}.topline h1{flex:1}.roundbtn{border:0;background:#0ba13c;color:white;border-radius:11px;font-size:22px;width:34px;height:34px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#f2f3f0;padding:3px;border-radius:20px;margin:8px 0 20px}.tabs button{border:0;background:transparent;border-radius:20px;padding:9px 4px;font-size:12px}.tabs .on{background:linear-gradient(#0bb044,#058d32);color:white;font-weight:700}.chips{display:flex;gap:5px;overflow:auto;padding:9px 0}.chips button{white-space:nowrap;border:0;border-radius:25px;background:#e9ebe9;padding:8px 13px;font-size:11px}.chips button.on{background:#078f33;color:white}.foodcard{display:flex;gap:11px;background:white;border:1px solid #eee;border-radius:14px;padding:8px;margin:9px 0;box-shadow:0 2px 9px #00000008;min-height:104px}.foodcard img{width:91px;height:101px;object-fit:cover;border-radius:10px}.foodcard .desc{flex:1;min-width:0}.foodcard b{font-size:13px}.foodcard p{font-size:11px;color:#6d7473;margin:5px 0}.foodcard small{background:#eef5ed;padding:4px 7px;border-radius:10px;font-size:10px}.heart{border:0;background:transparent;font-size:22px;align-self:start;color:#64716b}.measurehero{position:relative;overflow:hidden;min-height:224px}.measurehero img{position:absolute;right:0;top:0;height:100%;width:48%;object-fit:cover;opacity:.95}.measurehero .content{position:relative;z-index:1;max-width:65%}.measurehero h3{font-size:14px}.measurehero .number{font-size:35px;font-weight:800;margin:20px 0 3px}.greenbtn{background:#079c35;color:white;border:0;border-radius:11px;padding:12px 14px;font-size:13px;font-weight:700}.measurehero .greenbtn{width:100%;margin-top:20px}.chart{width:100%;height:145px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:13px;border-radius:13px;background:#fff;border:1px solid #eee}.metric b{display:block;font-size:21px;margin:9px 0}.metric small{font-size:11px;color:#7b817e}.formfield{display:block;font-size:13px;font-weight:600;margin:12px 0}.formfield input,.formfield select{width:100%;border:1px solid #d9e1d9;border-radius:10px;padding:12px;margin-top:6px;background:white}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.secondary{background:#eff4ef;color:#195c2f;border:0;border-radius:10px;padding:11px;font-size:12px}.entry{padding:12px 0;border-bottom:1px solid #eee;font-size:13px;display:flex;justify-content:space-between;gap:10px}.entry button{border:0;background:transparent;color:#bc3c3c}.notice{color:#76827b;font-size:12px;line-height:1.5}.hidden{display:none}.appicon{width:64px;height:64px;object-fit:cover;border-radius:15px}.brandbox{display:flex;gap:14px;align-items:center}.brandbox b{font-size:19px;color:#096a32}.settingsbtn{width:100%;margin:7px 0;text-align:left}.smallnote{font-size:11px;color:#777}.titleline{font-size:14px;font-weight:700;margin:15px 0 6px}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s);const key='mission-flacher-bauch-data';let state={page:'Heute',foodTab:'Vorschläge',bellyTab:'Übersicht',category:'Alle',day:new Date().toISOString().slice(0,10)};let db;try{db=JSON.parse(localStorage.getItem(key))||{}}catch(e){db={}};db.foods??=[];db.water??=[];db.activities??=[];db.measures??=[];db.favorites??=[];if(!localStorage.getItem(key)){try{let old=JSON.parse(localStorage.getItem('mfb-4-1')||'null');if(old){for(let [date,day] of Object.entries(old.days||{})){for(let f of day.food||[])db.foods.push({date,name:f.name||f.title||'Mahlzeit',kcal:Number(f.kcal||f.calories||0)});if(Number(day.water)>0)db.water.push({date,ml:Number(day.water)});for(let a of day.activity||[])db.activities.push({date,name:a.name||'Bewegung',minutes:Number(a.minutes||a.min||0)})}for(let m of old.measures||[])db.measures.push({date:m.date||new Date().toISOString().slice(0,10),weight:m.weight||null,waist:m.waist||m.belly||null});localStorage.setItem(key,JSON.stringify(db))}}catch(e){}}function save(){localStorage.setItem(key,JSON.stringify(db));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function week(){let d=new Date(state.day+'T12:00:00'),mon=new Date(d);mon.setDate(d.getDate()-(d.getDay()+6)%7);return Array.from({length:7},(_,i)=>{let t=new Date(mon);t.setDate(mon.getDate()+i);let v=t.toISOString().slice(0,10);return `<button class="day ${v===state.day?'active':''}" onclick="setDay('${v}')"><small>${['Mo','Di','Mi','Do','Fr','Sa','So'][i]}</small>${t.getDate()}</button>`}).join('')}function setDay(d){state.day=d;render()}function vals(){let f=db.foods.filter(x=>x.date===state.day).reduce((a,x)=>a+Number(x.kcal),0),w=db.water.filter(x=>x.date===state.day).reduce((a,x)=>a+Number(x.ml),0),m=db.activities.filter(x=>x.date===state.day).reduce((a,x)=>a+Number(x.minutes),0);return {f,w,m}}function ring(emoji,val,target,label,color){let p=Math.min(100,Math.round(val/target*100));return `<div class="ring" style="--pct:${p}%;--clr:${color}"><div class="ringin"><span class="emoji">${emoji}</span><b>${val.toLocaleString('de-CH')}</b><small>/ ${target.toLocaleString('de-CH')} ${label}</small></div></div>`}function home(){let v=vals(),checks=[db.foods.some(x=>x.date===state.day),v.m>0,db.measures.length>0],progress=Math.round(checks.filter(Boolean).length/3*100);return `<header class="hero"><strong>MISSION<br><span>FLACHER BAUCH</span></strong><em>Stärker. Gesünder. Du.</em><button class="gear" onclick="go('Mehr')">⚙</button></header><main class="main"><section class="panel today"><div class="todayhead"><div><h2>Heute</h2><p>${fmt(state.day)}</p></div><button class="check" onclick="setDay(new Date().toISOString().slice(0,10))">✓</button></div><div class="week">${week()}</div></section><section class="panel"><h3>Dein Tagesüberblick</h3><div class="rings">${ring('🔥',v.f,1900,'kcal','#139d40')}${ring('💧',+(v.w/1000).toFixed(2),2.5,'l','#4195e9')}${ring('🚶',v.m,30,'Min','#1ba646')}</div><p class="notice">Erfasste Werte – fehlende Einträge sind kein Tagesgesamtwert.</p></section><section class="panel"><div class="actions"><button class="action" onclick="go('Essen');state.foodTab='Tagebuch';render()"><span>🍏</span>Essen<br>hinzufügen</button><button class="action" onclick="water(250)"><span>💧</span>Wasser<br>+250 ml</button><button class="action" onclick="activityForm()"><span>🏃</span>Bewegung<br>erfassen</button><button class="action" onclick="measureForm()"><span>⚖️</span>Gewicht<br>eintragen</button></div></section><section class="panel"><div class="goalhead"><span>🏆 Dein Ziel</span><span>🎯</span></div><p class="sub">Flacher Bauch & Muskeln aufbauen</p><div class="row"><div class="bar" style="flex:1"><i style="width:${progress}%"></i></div><small>${progress}%</small></div>${['Regelmässig essen','Bewegung erfassen','Bauchumfang im Blick'].map((s,i)=>`<div class="task"><b style="background:${checks[i]?'#0b9d39':'#aeb8af'}">✓</b>${s}</div>`).join('')}</section><section class="panel"><button class="greenbtn" onclick="sendGPT()" style="width:100%">✨ An GPT senden</button><p class="smallnote">Tagesbericht kopieren und in ChatGPT öffnen</p></section></main>`}
const recipes=[{name:'Vollkorn-Sandwich mit Poulet',desc:'Eiweiss, Gemüse und gute Sättigung. Ideal für den Alltag.',kcal:450,img:'sandwich.jpg',tag:'Eiweissreich',cat:'Unterwegs'},{name:'Salat mit Poulet oder Ei',desc:'Leicht, frisch und trotzdem sättigend.',kcal:400,img:'salad.jpg',tag:'Viel Gemüse',cat:'Coop'},{name:'Skyr mit Früchten und Haferflocken',desc:'Schnell, eiweissreich und ideal wenn du wenig Appetit hast.',kcal:350,img:'skyr.jpg',tag:'Eiweissreich',cat:'Migros'},{name:'Marroni mit Skyr',desc:'Deine Marroni kombiniert mit Skyr – eine einfache Mahlzeit.',kcal:400,img:'marroni.jpg',tag:'Sättigend',cat:'Familienessen'}];function foodCard(r,i){return `<div class="foodcard"><img src="${r.img}" alt="${esc(r.name)}"><div class="desc"><b>${esc(r.name)}</b><p>${esc(r.desc)}</p><small>ca. ${r.kcal} kcal</small> <small>${r.tag}</small><div style="margin-top:8px"><button class="secondary" onclick="useRecipe(${i})">Eintragen +</button></div></div><button class="heart" onclick="favorite(${i})">${db.favorites.includes(i)?'♥':'♡'}</button></div>`}function favorite(i){db.favorites=db.favorites.includes(i)?db.favorites.filter(x=>x!==i):[...db.favorites,i];save()}function useRecipe(i){db.foods.push({date:state.day,name:recipes[i].name,kcal:recipes[i].kcal});save();alert('Mahlzeit eingetragen')}function food(){let t=state.foodTab;return `<section class="screen"><div class="topline"><span>⌕</span><h1>Essen</h1><button class="roundbtn" onclick="foodForm()">+</button></div><div class="tabs">${['Tagebuch','Vorschläge','Rezepte'].map(x=>`<button class="${t===x?'on':''}" onclick="state.foodTab='${x}';render()">${x}</button>`).join('')}</div>${t==='Tagebuch'?`<h3>Dein Ernährungstagebuch</h3><p class="sub">${fmt(state.day)}</p><button class="greenbtn" onclick="foodForm()">+ Essen eintragen</button>${entries(db.foods,'food')}`:`<h3>${t==='Vorschläge'?'Was esse ich heute?':'Einfache Rezepte'}</h3><p class="sub">Schnelle und alltagstaugliche Ideen für unterwegs oder zu Hause.</p><div class="chips">${['Alle','Coop','Migros','Unterwegs','Familienessen'].map(x=>`<button class="${state.category===x?'on':''}" onclick="state.category='${x}';render()">${x}</button>`).join('')}</div>${recipes.map((r,i)=>state.category==='Alle'||state.category===r.cat?foodCard(r,i):'').join('')}`}</section>`}function entries(items,type){let rows=items.map((x,i)=>({...x,i})).filter(x=>x.date===state.day);return rows.length?rows.map(x=>`<div class="entry"><span>${esc(x.name|| (type==='water'?x.ml+' ml Wasser':x.minutes+' Minuten Bewegung'))}<br><small>${type==='food'?x.kcal+' kcal':type==='measure'?x.waist+' cm':''}</small></span><button onclick="remove('${type}',${x.i})">Löschen</button></div>`).join(''):'<p class="notice">Noch keine Einträge für diesen Tag.</p>'}function remove(t,i){let map={food:'foods',water:'water',activity:'activities',measure:'measures'};db[map[t]].splice(i,1);save()}function water(n){db.water.push({date:state.day,ml:n});save()}function waterPage(){let v=vals();return `<section class="screen"><h1>Wasser 💧</h1><div class="panel" style="text-align:center"><div style="font-size:44px">💧</div><h2>${(v.w/1000).toFixed(2)} l / 2.5 l</h2><div class="bar"><i style="width:${Math.min(100,v.w/2500*100)}%"></i></div><div class="row"><button class="secondary" onclick="water(-250)">− 250 ml</button><button class="greenbtn" onclick="water(250)">+ 250 ml</button></div><p class="smallnote">Jede Änderung wird einzeln gespeichert.</p></div><div class="panel"><h3>Einträge</h3>${entries(db.water,'water')}</div></section>`}function chart(){let a=[...db.measures].filter(x=>Number(x.waist)>0).sort((x,y)=>x.date.localeCompare(y.date)).slice(-6);if(a.length<2)return '<p class="notice">Trage mindestens zwei Bauchumfänge ein, um deinen Verlauf zu sehen.</p>';let values=a.map(x=>Number(x.waist)),lo=Math.floor(Math.min(...values)-3),hi=Math.ceil(Math.max(...values)+3),pts=values.map((v,i)=>`${30+i*270/(a.length-1)},${115-(v-lo)/(hi-lo)*95}`).join(' ');return `<svg class="chart" viewBox="0 0 330 145" role="img" aria-label="Bauchumfang Verlauf">${[0,1,2,3].map(i=>`<line x1="30" y1="${20+i*31}" x2="310" y2="${20+i*31}" stroke="#e7eae7"/>`).join('')}<polyline points="${pts}" fill="none" stroke="#079c35" stroke-width="3"/>${pts.split(' ').map(s=>{let [x,y]=s.split(',');return `<circle cx="${x}" cy="${y}" r="4" fill="#079c35"/>`}).join('')}</svg>`}function belly(){let a=[...db.measures].sort((x,y)=>x.date.localeCompare(y.date)),last=a.at(-1),waist=a.filter(x=>x.waist).at(-1),weights=a.filter(x=>x.weight).map(x=>+x.weight),avg=weights.length?(weights.reduce((a,b)=>a+b,0)/weights.length).toFixed(1):'–';return `<section class="screen"><h1>Bauch</h1><div class="tabs">${['Übersicht','Verlauf','Tipps'].map(x=>`<button class="${state.bellyTab===x?'on':''}" onclick="state.bellyTab='${x}';render()">${x}</button>`).join('')}</div>${state.bellyTab==='Tipps'?`<div class="panel"><h3>Deine Tipps</h3><p>Regelmässig bewegen, ausgewogen essen und den Bauchumfang unter ähnlichen Bedingungen messen.</p></div>`:`<div class="panel measurehero"><img src="body.jpg" alt="Symbolbild Bauchumfang"><div class="content"><h3>📏 Bauchumfang</h3><div class="number">${waist?esc(waist.waist)+' cm':'– cm'}</div><p class="sub">Aktueller Wert<br>${waist?waist.date:'Noch kein Wert'}</p><button class="greenbtn" onclick="measureForm()">Neuen Wert eintragen</button></div></div><div class="panel"><h3>Verlauf Bauchumfang</h3>${chart()}</div><div class="metrics"><div class="metric">⚖️ Gewicht<b>${last?.weight?esc(last.weight)+' kg':'– kg'}</b><small>Aktueller Wert</small></div><div class="metric">📈 Durchschnitt<b>${avg} kg</b><small>Erfasste Messwerte</small></div></div>${state.bellyTab==='Verlauf'?`<div class="panel"><h3>Messungen</h3>${a.slice().reverse().map(x=>`<div class="entry">${x.date}: ${x.weight||'–'} kg · ${x.waist||'–'} cm</div>`).join('')}</div>`:''}`}</section>`}function more(){return `<section class="screen"><h1>Mehr</h1><div class="panel brandbox"><img class="appicon" src="apple-touch-icon.png"><div><b>MISSION FLACHER BAUCH</b><p class="sub">Stärker. Gesünder. Du.</p></div></div><div class="panel"><h3>Deine Funktionen</h3><button class="secondary settingsbtn" onclick="activityForm()">🏃 Bewegung erfassen</button><button class="secondary settingsbtn" onclick="measureForm()">⚖️ Gewicht & Bauchumfang</button><button class="secondary settingsbtn" onclick="sendGPT()">✨ An GPT senden</button><button class="secondary settingsbtn" onclick="exportData()">⬇ Daten sichern (JSON)</button><label class="secondary settingsbtn" style="display:block">⬆ Datensicherung importieren<input type="file" accept="application/json" onchange="importData(event)" style="display:block;margin-top:8px;width:100%"></label></div><div class="panel"><h3>Bewegung heute</h3>${entries(db.activities,'activity')}</div></section>`}function go(p){state.page=p;render();window.scrollTo(0,0)}function render(){document.getElementById('app').innerHTML=(state.page==='Heute'?home():state.page==='Essen'?food():state.page==='Wasser'?waterPage():state.page==='Bauch'?belly():more())+`<nav class="nav">${[['Heute','⌂'],['Essen','🍴'],['Wasser','💧'],['Bauch','⚖'],['Mehr','•••']].map(([n,icon])=>`<button class="${state.page===n?'on':''}" onclick="go('${n}')"><span>${icon}</span>${n}</button>`).join('')}</nav>`}function promptNum(msg){let s=prompt(msg);if(s===null)return null;let n=Number(s.replace(',','.'));return Number.isFinite(n)&&n>=0?n:null}function foodForm(){let name=prompt('Was hast du gegessen?');if(!name)return;let kcal=promptNum('Wie viele kcal ungefähr?');if(kcal===null)return alert('Bitte gültige Kalorien eingeben.');db.foods.push({date:state.day,name,kcal});save()}function activityForm(){let name=prompt('Welche Bewegung? (z. B. Spazieren)');if(!name)return;let minutes=promptNum('Wie viele Minuten?');if(minutes===null)return alert('Bitte gültige Minuten eingeben.');db.activities.push({date:state.day,name,minutes});save()}function measureForm(){let weight=prompt('Gewicht in kg (leer lassen, wenn unbekannt):','');if(weight===null)return;let waist=prompt('Bauchumfang in cm (leer lassen, wenn unbekannt):','');if(waist===null)return;let w=weight.trim()?Number(weight.replace(',','.')):null,b=waist.trim()?Number(waist.replace(',','.')):null;if((w!==null&&(!Number.isFinite(w)||w<=0))||(b!==null&&(!Number.isFinite(b)||b<=0)))return alert('Bitte gültige Werte eingeben.');if(w===null&&b===null)return;db.measures.push({date:state.day,weight:w,waist:b});save()}function sendGPT(){let v=vals(),t=`Mission Flacher Bauch – Tagesbericht ${fmt(state.day)}\nKalorien: ${v.f} kcal\nWasser: ${v.w} ml\nBewegung: ${v.m} Minuten\nEssen: ${db.foods.filter(x=>x.date===state.day).map(x=>x.name).join(', ')||'Keine Einträge'}\nBitte analysiere meinen Tag und gib mir konstruktive Tipps.`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>{alert('Bericht kopiert. Füge ihn in ChatGPT ein.');location.href='https://chatgpt.com/'}).catch(()=>prompt('Bericht kopieren:',t));else prompt('Bericht kopieren:',t)}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mission-flacher-bauch-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function importData(e){let f=e.target.files?.[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!d||!Array.isArray(d.foods))throw Error('Ungültige Sicherung');if(confirm('Vorhandene Daten durch die Sicherung ersetzen?')){db=d;save()}}).catch(()=>alert('Datei konnte nicht gelesen werden.'))}render();
</script></body></html>
