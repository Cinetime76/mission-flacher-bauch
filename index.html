5px;overflow:auto;padding:9px 0}.chips button{white-space:nowrap;border:0;border-radius:25px;background:#e9ebe9;padding:8px 13px;font-size:11px}.chips button.on{background:#078f33;color:white}.foodcard{display:flex;gap:11px;background:white;border:1px solid #eee;border-radius:14px;padding:8px;margin:9px 0;box-shadow:0 2px 9px #00000008;min-height:104px}.foodcard img{width:91px;height:101px;object-fit:cover;border-radius:10px}.foodcard .desc{flex:1;min-width:0}.foodcard b{font-size:13px}.foodcard p{font-size:11px;color:#6d7473;margin:5px 0}.foodcard small{background:#eef5ed;padding:4px 7px;border-radius:10px;font-size:10px}.heart{border:0;background:transparent;font-size:22px;align-self:start;color:#64716b}.measurehero{position:relative;overflow:hidden;min-height:224px}.measurehero img{position:absolute;right:0;top:0;height:100%;width:48%;object-fit:cover;opacity:.95}.measurehero .content{position:relative;z-index:1;max-width:65%}.measurehero h3{font-size:14px}.measurehero .number{font-size:35px;font-weight:800;margin:20px 0 3px}.greenbtn{background:#079c35;color:white;border:0;border-radius:11px;padding:12px 14px;font-size:13px;font-weight:700}.measurehero .greenbtn{width:100%;margin-top:20px}.chart{width:100%;height:145px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:13px;border-radius:13px;background:#fff;border:1px solid #eee}.metric b{display:block;font-size:21px;margin:9px 0}.metric small{font-size:11px;color:#7b817e}.formfield{display:block;font-size:13px;font-weight:600;margin:12px 0}.formfield input,.formfield select{width:100%;border:1px solid #d9e1d9;border-radius:10px;padding:12px;margin-top:6px;background:white}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.secondary{background:#eff4ef;color:#195c2f;border:0;border-radius:10px;padding:11px;font-size:12px}.entry{padding:12px 0;border-bottom:1px solid #eee;font-size:13px;display:flex;justify-content:space-between;gap:10px}.entry button{border:0;background:transparent;color:#bc3c3c}.notice{color:#76827b;font-size:12px;line-height:1.5}.hidden{display:none}.appicon{width:64px;height:64px;object-fit:cover;border-radius:15px}.brandbox{display:flex;gap:14px;align-items:center}.brandbox b{font-size:19px;color:#096a32}.settingsbtn{width:100%;margin:7px 0;text-align:left}.smallnote{font-size:11px;color:#777}.titleline{font-size:14px;font-weight:700;margin:15px 0 6px}

const $=s=>document.querySelector(s);const key='mission-flacher-bauch-data';let state={page:'Heute',foodTab:'Vorschläge',bellyTab:'Übersicht',category:'Alle',day:new Date().toISOString().slice(0,10)};let db;try{db=JSON.parse(localStorage.getItem(key))||{}}catch(e){db={}};db.foods??=[];db.water??=[];db.activities??=[];db.measures??=[];db.favorites??=[];db.profile??={calories:1900,water:2500};db.customRecipes??=[];db.sleep??=[];if(!localStorage.getItem(key)){try{let old=JSON.parse(localStorage.getItem('mfb-4-1')||'null');if(old){for(let [date,day] of Object.entries(old.days||{})){for(let f of day.food||[])db.foods.push({date,name:f.name||f.title||'Mahlzeit',kcal:Number(f.kcal||f.calories||0)});if(Number(day.water)>0)db.water.push({date,ml:Number(day.water)});for(let a of day.activity||[])db.activities.push({date,name:a.name||'Bewegung',minutes:Number(a.minutes||a.min||0)})}for(let m of old.measures||[])db.measures.push({date:m.date||new Date().toISOString().slice(0,10),weight:m.weight||null,waist:m.waist||m.belly||null});localStorage.setItem(key,JSON.stringify(db))}}catch(e){}}function save(){localStorage.setItem(key,JSON.stringify(db));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function week(){let d=new Date(state.day+'T12:00:00'),mon=new Date(d);mon.setDate(d.getDate()-(d.getDay()+6)%7);return Array.from({length:7},(_,i)=>{let t=new Date(mon);t.setDate(mon.getDate()+i);let v=t.toISOString().slice(0,10);return `<button class="day ${v===state.day?'active':''}" onclick="setDay('${v}')"><small>${['Mo','Di','Mi','Do','Fr','Sa','So'][i]}</small>${t.getDate()}</button>`}).join('')}function setDay(d){state.day=d;dayOverview()}function vals(){let f=db.foods.filter(x=>x.date===state.day).reduce((a,x)=>a+Number(x.kcal),0),w=db.water.filter(x=>x.date===state.day).reduce((a,x)=>a+Number(x.ml),0),m=db.activities.filter(x=>x.date===state.day).reduce((a,x)=>a+Number(x.minutes),0);return {f,w,m}}function ring(emoji,val,target,label,color){let p=Math.min(100,Math.round(val/target*100));return `<div class="ring" style="--pct:${p}%;--clr:${color}"><div class="ringin"><span class="emoji">${emoji}</span><b>${val.toLocaleString('de-CH')}</b><small>/ ${target.toLocaleString('de-CH')} ${label}</small></div></div>`}function home(){let v=vals(),checks=[db.foods.some(x=>x.date===state.day),v.m>0,db.measures.length>0],progress=Math.round(checks.filter(Boolean).length/3*100);return `<header class="hero"><strong>MISSION<br><span>FLACHER BAUCH</span></strong><em>Stärker. Gesünder. Du.</em><button class="gear" onclick="go('Mehr')">⚙</button></header><main class="main"><section class="panel today"><div class="todayhead"><div><h2>Heute</h2><p>${fmt(state.day)}</p></div><button class="dayoverviewbtn" onclick="dayOverview()">📅 Tagesübersicht ›</button></div><div class="week">${week()}</div></section><section class="panel"><h3>Dein Tagesüberblick</h3><div class="rings">${ring('🔥',v.f,Number(db.profile.calories)||1900,'kcal','#139d40')}${ring('💧',+(v.w/1000).toFixed(2),(Number(db.profile.water)||2500)/1000,'l','#4195e9')}${ring('🚶',v.m,30,'Min','#1ba646')}</div><p class="notice">Erfasste Werte – fehlende Einträge sind kein Tagesgesamtwert.</p></section>${calorieCard()}<section class="panel"><div class="waterquick"><b>💧 Wasser · ${(v.w/1000).toFixed(2)} / ${((Number(db.profile.water)||2500)/1000).toFixed(2)} l</b><div class="row"><button class="secondary" onclick="undoWater()" aria-label="Letzten Wassereintrag entfernen">−</button><button class="greenbtn" onclick="water(250)" aria-label="250 Milliliter Wasser hinzufügen">+</button></div></div><div class="bar"><i style="width:${Math.min(100,v.w/(Number(db.profile.water)||2500)*100)}%;background:#42b8df"></i></div><button class="secondary" onclick="go('Wasser')">Alle Wassereinträge ansehen ›</button></section><section class="panel"><div class="actions"><button class="action" onclick="go('Essen');state.foodTab='Tagebuch';render()"><span>🍏</span>Essen<br>hinzufügen</button><button class="action" onclick="water(250)"><span>💧</span>Wasser<br>+250 ml</button><button class="action" onclick="activityForm()"><span>🏃</span>Bewegung<br>erfassen</button><button class="action" onclick="measureForm()"><span>⚖️</span>Gewicht<br>eintragen</button></div></section><section class="panel"><div class="coachbuttons"><button class="coachprimary" onclick="sendGPT()">✦ An GPT senden</button><button class="coachsecondary" onclick="sendGPT()">♙ Mein Coach</button></div></section><section class="panel"><div class="goalhead"><span>🏆 Dein Ziel</span><span>🎯</span></div><p class="sub">Flacher Bauch & Muskeln aufbauen</p><div class="row"><div class="bar" style="flex:1"><i style="width:${progress}%"></i></div><small>${progress}%</small></div>${['Regelmässig essen','Bewegung erfassen','Bauchumfang im Blick'].map((s,i)=>`<div class="task"><b style="background:${checks[i]?'#0b9d39':'#aeb8af'}">✓</b>${s}</div>`).join('')}</section><section class="panel"><div class="coachbuttons"><button class="coachprimary" onclick="sendGPT()">✦ An GPT senden</button><button class="coachsecondary" onclick="sendGPT()">♙ Mein Coach</button></div><p class="smallnote">Deinen Tagesbericht für dein Coaching in ChatGPT übernehmen.</p></section></main>`}
const recipes=[{name:'Vollkorn-Sandwich mit Poulet',desc:'Eiweiss, Gemüse und gute Sättigung. Ideal für den Alltag.',kcal:450,img:'sandwich.jpg',tag:'Eiweissreich',cat:'Unterwegs'},{name:'Salat mit Poulet oder Ei',desc:'Leicht, frisch und trotzdem sättigend.',kcal:400,img:'salad.jpg',tag:'Viel Gemüse',cat:'Coop'},{name:'Skyr mit Früchten und Haferflocken',desc:'Schnell, eiweissreich und ideal wenn du wenig Appetit hast.',kcal:350,img:'skyr.jpg',tag:'Eiweissreich',cat:'Migros'},{name:'Marroni mit Skyr',desc:'Deine Marroni kombiniert mit Skyr – eine einfache Mahlzeit.',kcal:400,img:'marroni.jpg',tag:'Sättigend',cat:'Familienessen'}];function foodCard(r,i){return `<div class="foodcard"><img src="${r.img}" alt="${esc(r.name)}"><div class="desc"><b>${esc(r.name)}</b><p>${esc(r.desc)}</p><small>ca. ${r.kcal} kcal</small> <small>${r.tag}</small><div style="margin-top:8px"><button class="secondary" onclick="useRecipe(${i})">Eintragen +</button></div></div><button class="heart" onclick="favorite(${i})">${db.favorites.includes(i)?'♥':'♡'}</button></div>`}function favorite(i){db.favorites=db.favorites.includes(i)?db.favorites.filter(x=>x!==i):[...db.favorites,i];save()}function useRecipe(i){db.foods.push({date:state.day,name:recipes[i].name,kcal:recipes[i].kcal,meal:'Snacks'});save();alert('Mahlzeit eingetragen')}function food(){let t=state.foodTab;return `<section class="screen"><div class="topline"><span>⌕</span><h1>Essen</h1><button class="roundbtn" onclick="foodMenu()">+</button></div><div class="tabs">${['Tagebuch','Vorschläge','Rezepte'].map(x=>`<button class="${t===x?'on':''}" onclick="state.foodTab='${x}';render()">${x}</button>`).join('')}</div>${t==='Tagebuch'?`<h3>Dein Ernährungstagebuch</h3><p class="sub">${fmt(state.day)}</p>${calorieCard()}<div class="panel"><button class="greenbtn" onclick="foodMenu()">+ Essen eintragen / Scannen</button></div>${mealDiary()}`:`<h3>${t==='Vorschläge'?'Was esse ich heute?':'Einfache Rezepte'}</h3><p class="sub">Schnelle und alltagstaugliche Ideen für unterwegs oder zu Hause.</p><div class="chips">${['Alle','Coop','Migros','Unterwegs','Familienessen'].map(x=>`<button class="${state.category===x?'on':''}" onclick="state.category='${x}';render()">${x}</button>`).join('')}</div>${recipes.map((r,i)=>state.category==='Alle'||state.category===r.cat?foodCard(r,i):'').join('')}${t==='Rezepte'?customRecipeCards():''}${t==='Rezepte'?'<button class="greenbtn" onclick="recipeForm()">+ Eigenes Rezept erstellen</button>':''}`}</section>`}function entries(items,type){let rows=items.map((x,i)=>({...x,i})).filter(x=>x.date===state.day);return rows.length?rows.map(x=>`<div class="entry"><span>${esc(x.name|| (type==='water'?x.ml+' ml Wasser':x.minutes+' Minuten Bewegung'))}<br><small>${type==='food'?x.kcal+' kcal':type==='measure'?x.waist+' cm':''}</small></span><button onclick="remove('${type}',${x.i})">Löschen</button></div>`).join(''):'<p class="notice">Noch keine Einträge für diesen Tag.</p>'}function remove(t,i){let map={food:'foods',water:'water',activity:'activities',measure:'measures'};db[map[t]].splice(i,1);save()}function water(n){db.water.push({date:state.day,ml:n});save()}function waterPage(){let v=vals();return `<section class="screen"><h1>Wasser 💧</h1><div class="panel" style="text-align:center"><div style="font-size:44px">💧</div><h2>${(v.w/1000).toFixed(2)} l / 2.5 l</h2><div class="bar"><i style="width:${Math.min(100,v.w/2500*100)}%"></i></div><div class="row"><button class="secondary" onclick="undoWater()">− Letzte 250 ml</button><button class="greenbtn" onclick="water(250)">+ 250 ml</button></div><p class="smallnote">Jede Änderung wird einzeln gespeichert.</p></div><div class="panel"><h3>Einträge</h3>${entries(db.water,'water')}</div></section>`}function chart(){let a=[...db.measures].filter(x=>Number(x.waist)>0).sort((x,y)=>x.date.localeCompare(y.date)).slice(-6);if(a.length<2)return '<p class="notice">Trage mindestens zwei Bauchumfänge ein, um deinen Verlauf zu sehen.</p>';let values=a.map(x=>Number(x.waist)),lo=Math.floor(Math.min(...values)-3),hi=Math.ceil(Math.max(...values)+3),pts=values.map((v,i)=>`${30+i*270/(a.length-1)},${115-(v-lo)/(hi-lo)*95}`).join(' ');return `<svg class="chart" viewBox="0 0 330 145" role="img" aria-label="Bauchumfang Verlauf">${[0,1,2,3].map(i=>`<line x1="30" y1="${20+i*31}" x2="310" y2="${20+i*31}" stroke="#e7eae7"/>`).join('')}<polyline points="${pts}" fill="none" stroke="#079c35" stroke-width="3"/>${pts.split(' ').map(s=>{let [x,y]=s.split(',');return `<circle cx="${x}" cy="${y}" r="4" fill="#079c35"/>`}).join('')}</svg>`}function belly(){let a=[...db.measures].sort((x,y)=>x.date.localeCompare(y.date)),last=a.at(-1),waist=a.filter(x=>x.waist).at(-1),weights=a.filter(x=>x.weight).map(x=>+x.weight),avg=weights.length?(weights.reduce((a,b)=>a+b,0)/weights.length).toFixed(1):'–';return `<section class="screen"><h1>Bauch</h1><div class="tabs">${['Übersicht','Verlauf','Tipps'].map(x=>`<button class="${state.bellyTab===x?'on':''}" onclick="state.bellyTab='${x}';render()">${x}</button>`).join('')}</div>${state.bellyTab==='Tipps'?`<div class="panel"><h3>Deine Tipps</h3><p>Regelmässig bewegen, ausgewogen essen und den Bauchumfang unter ähnlichen Bedingungen messen.</p></div>`:`<div class="panel measurehero"><img src="body.jpg" alt="Symbolbild Bauchumfang"><div class="content"><h3>📏 Bauchumfang</h3><div class="number">${waist?esc(waist.waist)+' cm':'– cm'}</div><p class="sub">Aktueller Wert<br>${waist?waist.date:'Noch kein Wert'}</p><button class="greenbtn" onclick="measureForm()">Neuen Wert eintragen</button></div></div><div class="panel"><h3>Verlauf Bauchumfang</h3>${chart()}</div><div class="metrics"><div class="metric">⚖️ Gewicht<b>${last?.weight?esc(last.weight)+' kg':'– kg'}</b><small>Aktueller Wert</small></div><div class="metric">📈 Durchschnitt<b>${avg} kg</b><small>Erfasste Messwerte</small></div></div>${state.bellyTab==='Verlauf'?`<div class="panel"><h3>Messungen</h3>${a.slice().reverse().map(x=>`<div class="entry">${x.date}: ${x.weight||'–'} kg · ${x.waist||'–'} cm</div>`).join('')}</div>`:''}`}</section>`}function more(){return `<section class="screen"><h1>Mehr</h1><div class="panel brandbox"><img class="appicon" src="apple-touch-icon.png"><div><b>MISSION FLACHER BAUCH</b><p class="sub">Stärker. Gesünder. Du.</p></div></div><div class="panel"><h3>Deine Funktionen</h3><button class="secondary settingsbtn" onclick="profileForm()">👤 Mein Profil & Ziele</button><button class="secondary settingsbtn" onclick="dayOverview()">📅 Tagesübersicht</button><button class="secondary settingsbtn" onclick="sleepForm()">🌙 Schlaf erfassen</button><button class="secondary settingsbtn" onclick="healthInfo()">❤️ Apple Health – Verbindung</button><button class="secondary settingsbtn" onclick="activityForm()">🏃 Bewegung erfassen</button><button class="secondary settingsbtn" onclick="measureForm()">⚖️ Gewicht & Bauchumfang</button><button class="secondary settingsbtn" onclick="sendGPT()">✨ An GPT senden</button><button class="secondary settingsbtn" onclick="exportData()">⬇ Daten sichern (JSON)</button><label class="secondary settingsbtn" style="display:block">⬆ Datensicherung importieren<input type="file" accept="application/json" onchange="importData(event)" style="display:block;margin-top:8px;width:100%"></label></div><div class="panel"><h3>Bewegung heute</h3>${entries(db.activities,'activity')}</div></section>`}function go(p){state.page=p;render();window.scrollTo(0,0)}function render(){document.getElementById('app').innerHTML=(state.page==='Heute'?home():state.page==='Essen'?food():state.page==='Wasser'?waterPage():state.page==='Bauch'?belly():state.page==='Tagesübersicht'?`<section class="screen"><button class="secondary" onclick="go('Heute')">← Zurück</button>${dayDetails()}</section>`:more())+`<nav class="nav">${[['Heute','⌂'],['Essen','🍴'],['Wasser','💧'],['Bauch','⚖'],['Mehr','•••']].map(([n,icon])=>`<button class="${state.page===n?'on':''}" onclick="go('${n}')"><span>${icon}</span>${n}</button>`).join('')}</nav>`}function promptNum(msg){let s=prompt(msg);if(s===null)return null;let n=Number(s.replace(',','.'));return Number.isFinite(n)&&n>=0?n:null}function foodForm(meal='Snacks'){let name=prompt('Was hast du gegessen?');if(!name)return;let kcal=promptNum('Kalorien der verzehrten Portion (kcal):');if(kcal===null)return alert('Bitte gültige Kalorien eingeben.');db.foods.push({date:state.day,name,kcal,meal});save()}function activityForm(){let name=prompt('Aktivität (Spazieren, Laufband, Krafttraining, Büroarbeit usw.):');if(!name)return;let minutes=promptNum('Wie viele Minuten?');if(minutes===null)return alert('Bitte gültige Minuten eingeben.');let kcal=promptNum('Geschätzte Aktivitätskalorien (0 falls unbekannt):');if(kcal===null)return;db.activities.push({date:state.day,name,minutes,kcal});save()}function measureForm(){let weight=prompt('Gewicht in kg (leer lassen, wenn unbekannt):','');if(weight===null)return;let waist=prompt('Bauchumfang in cm (leer lassen, wenn unbekannt):','');if(waist===null)return;let w=weight.trim()?Number(weight.replace(',','.')):null,b=waist.trim()?Number(waist.replace(',','.')):null;if((w!==null&&(!Number.isFinite(w)||w<=0))||(b!==null&&(!Number.isFinite(b)||b<=0)))return alert('Bitte gültige Werte eingeben.');if(w===null&&b===null)return;db.measures.push({date:state.day,weight:w,waist:b});save()}function sendGPT(){let v=vals(),t=`Mission Flacher Bauch – Tagesbericht ${fmt(state.day)}\nKalorien: ${v.f} kcal\nWasser: ${v.w} ml\nBewegung: ${v.m} Minuten\nEssen: ${db.foods.filter(x=>x.date===state.day).map(x=>x.name).join(', ')||'Keine Einträge'}\nBitte analysiere meinen Tag und gib mir konstruktive Tipps.`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>{alert('Bericht kopiert. Füge ihn in ChatGPT ein.');location.href='https://chatgpt.com/'}).catch(()=>prompt('Bericht kopieren:',t));else prompt('Bericht kopieren:',t)}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mission-flacher-bauch-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function importData(e){let f=e.target.files?.[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!d||!Array.isArray(d.foods))throw Error('Ungültige Sicherung');if(confirm('Vorhandene Daten durch die Sicherung ersetzen?')){db=d;save()}}).catch(()=>alert('Datei konnte nicht gelesen werden.'))}
function calorieCard(){let v=vals(),goal=Number(db.profile.calories)||1900,remaining=goal-v.f;return `<section class="panel"><h3>🔥 Deine Kalorienbilanz</h3><div class="calgrid"><div><small>Tagesziel</small><b>${goal} kcal</b></div><div><small>Aufgenommen</small><b>${Math.round(v.f)} kcal</b></div><div><small>Verbleibend</small><b style="color:${remaining<0?'#b43c32':'#079b3b'}">${Math.round(remaining)} kcal</b></div></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,v.f/goal*100))}%"></i></div><p class="smallnote">Kalorien werden aus deinen erfassten Mahlzeiten berechnet; Sport wird separat angezeigt.</p></section>`}
function mealDiary(){return ['Frühstück','Mittagessen','Abendessen','Snacks'].map(m=>{let a=db.foods.map((x,i)=>({...x,i})).filter(x=>x.date===state.day&&(x.meal||'Snacks')===m);return `<section class="panel"><div class="mealhead"><h3>${{'Frühstück':'🌅','Mittagessen':'☀️','Abendessen':'🌇','Snacks':'🌙'}[m]} ${m} <small>${a.reduce((n,x)=>n+Number(x.kcal||0),0)} kcal</small></h3><button class="roundbtn" onclick="foodMenu('${m}')">+</button></div>${a.map(x=>`<div class="entry"><span>${esc(x.name)}<br><small>${x.kcal} kcal</small></span><button onclick="editEntry('foods',${x.i})">Bearbeiten</button></div>`).join('')||'<p class="smallnote">Noch nichts erfasst.</p>'}</section>`}).join('')}
function dayDetails(){let v=vals(),f=db.foods.map((x,i)=>({...x,i})).filter(x=>x.date===state.day),w=db.water.map((x,i)=>({...x,i})).filter(x=>x.date===state.day),a=db.activities.map((x,i)=>({...x,i})).filter(x=>x.date===state.day),sl=db.sleep.map((x,i)=>({...x,i})).filter(x=>x.date===state.day),me=db.measures.map((x,i)=>({...x,i})).filter(x=>x.date===state.day);let section=(title,arr,field,unit)=>`<h4>${title}</h4>${arr.map(x=>`<div class="entry"><span>${esc(x.name||(x.ml!=null?x.ml+' ml':x.weight!=null?'Gewicht/Bauch':'Eintrag'))} <small>${field?esc(x[field]??'')+' '+unit:''}</small></span><button onclick="editEntry('${title==='Essen'?'foods':title==='Wasser'?'water':title==='Aktivität'?'activities':title==='Schlaf'?'sleep':'measures'}',${x.i})">✎</button></div>`).join('')||'<p class="smallnote">Keine Einträge</p>'}`;return `<section class="panel" id="daydetails"><h3>📅 Tagesübersicht – ${fmt(state.day)}</h3><p class="sub">Alles an einem Ort – Einträge antippen zum Bearbeiten.</p>${section('Essen',f,'kcal','kcal')}${section('Wasser',w,'ml','ml')}${section('Aktivität',a,'minutes','Min')}${section('Schlaf',sl,'hours','Std')}${section('Messungen',me,'weight','kg')}<div class="row"><button class="secondary" onclick="foodMenu()">+ Essen</button><button class="secondary" onclick="sleepForm()">+ Schlaf</button></div></section>`}
function dayOverview(){state.page='Tagesübersicht';render();window.scrollTo(0,0)}
function undoWater(){let i=db.water.findLastIndex(x=>x.date===state.day&&x.ml>0);if(i<0)return alert('Heute gibt es keinen positiven Wassereintrag zum Entfernen.');db.water.splice(i,1);save()}
function editEntry(type,i){let x=db[type][i];if(!x)return;let field=type==='foods'?'kcal':type==='water'?'ml':type==='activities'?'minutes':type==='sleep'?'hours':'weight';let name=type==='foods'||type==='activities'?prompt('Bezeichnung:',x.name||''):null;if(name===null&&(type==='foods'||type==='activities'))return;let val=prompt('Neuer Wert ('+field+'):',x[field]??'');if(val===null)return;let n=Number(val.replace(',','.'));if(!Number.isFinite(n)||n<0)return alert('Ungültige Zahl.');if(name!==null)x.name=name;x[field]=n;if(confirm('Eintrag speichern? OK = Speichern, Abbrechen = Weitere Optionen'))save();else if(confirm('Diesen Eintrag wirklich löschen?')){db[type].splice(i,1);save()}}
function profileForm(){let p=db.profile;for(let [key,label] of [['birthday','Geburtsdatum (JJJJ-MM-TT)'],['height','Grösse (cm)'],['weight','Gewicht (kg)'],['waist','Bauchumfang (cm)'],['targetWeight','Wunschgewicht (kg)'],['calories','Kalorienziel (kcal/Tag)'],['water','Wasserziel (ml/Tag)'],['goal','Mein Ziel'],['activity','Aktivitätsniveau (z. B. Büro / aktiv)']]){let v=prompt(label,p[key]??'');if(v===null)break;p[key]=v}save()}
function sleepForm(){let hours=promptNum('Wie viele Stunden hast du in der Nacht auf diesen Tag geschlafen?');if(hours===null)return;db.sleep.push({date:state.day,hours,name:'Schlaf'});save()}
function healthInfo(){alert('Apple Health kann aus einer GitHub-Web-App nicht direkt ausgelesen werden. Für automatische Schritte und Schlaf benötigen wir später eine native iOS-App mit HealthKit oder einen bewusst eingerichteten Kurzbefehle-Import. Es werden keine Health-Daten vorgetäuscht.')}
function foodMenu(meal='Snacks'){state.meal=meal;document.getElementById('modal').innerHTML=`<div class="sheet"><button class="close" onclick="closeModal()">✕</button><h2>🍏 Essen hinzufügen</h2><p class="sub">${esc(meal)} · ${fmt(state.day)}</p><button onclick="closeModal();foodForm(state.meal)">✍️ Lebensmittel manuell eingeben</button><button onclick="closeModal();barcodeStart()">▥ Strichcode scannen</button><button onclick="closeModal();barcodePrompt()">🔢 Strichcode eintippen</button><button onclick="closeModal();photoFood()">📷 Lebensmittel fotografieren</button><button onclick="closeModal();state.foodTab='Rezepte';go('Essen')">📖 Rezept auswählen</button><button onclick="closeModal();state.foodTab='Rezepte';go('Essen');recipeForm()">➕ Eigenes Rezept erstellen</button></div>`;document.getElementById('modal').style.display='grid'}
function closeModal(){document.getElementById('modal').style.display='none';document.getElementById('modal').innerHTML=''}
function barcodePrompt(){let code=prompt('EAN/UPC-Strichcode eingeben:');if(code)lookupBarcode(code)}
async function lookupBarcode(code){if(!/^\d{8,14}$/.test(code))return alert('Bitte einen gültigen 8- bis 14-stelligen Strichcode eingeben.');try{let r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json');if(!r.ok)throw Error();let data=await r.json(),p=data.product;if(!p)return alert('Produkt nicht gefunden. Du kannst es manuell erfassen.');let name=p.product_name_de||p.product_name||p.generic_name||'Produkt '+code,per=Number(p.nutriments?.['energy-kcal_100g']);if(!Number.isFinite(per)||per<=0)return alert('Produkt gefunden: '+name+'. Es fehlen verlässliche Kalorienangaben. Bitte manuell eintragen.');let grams=prompt(name+'\n'+per+' kcal je 100 g\nWie viele Gramm hast du gegessen?','100');if(grams===null)return;let n=Number(grams.replace(',','.'));if(!Number.isFinite(n)||n<=0)return alert('Ungültige Menge');db.foods.push({date:state.day,meal:state.meal||'Snacks',name,kcal:Math.round(per*n/100),grams:n,barcode:code});save();alert('Lebensmittel eingetragen. Bitte Nährwerte auf der Packung kontrollieren.')}catch(e){alert('Online-Abfrage momentan nicht verfügbar. Bitte Lebensmittel manuell erfassen.')}}
async function barcodeStart(){if(!('BarcodeDetector' in window)){alert('Der direkte Kamerascan wird von diesem Browser nicht unterstützt. Du kannst einen Barcode eintippen oder mit der Kamera fotografieren.');return barcodePrompt()}let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';inp.onchange=async()=>{try{let bitmap=await createImageBitmap(inp.files[0]);let detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});let results=await detector.detect(bitmap);if(results.length)lookupBarcode(results[0].rawValue);else alert('Kein Barcode erkannt. Versuche es erneut oder gib die Nummer ein.')}catch(e){alert('Barcode konnte nicht gelesen werden.');barcodePrompt()}};inp.click()}
function photoFood(){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';inp.onchange=()=>{if(!inp.files?.[0])return;alert('Foto aufgenommen. Automatische KI-Kalorienerkennung ist noch nicht verbunden. Bitte Lebensmittel und Portion zurzeit selbst eingeben.');foodForm(state.meal||'Snacks')};inp.click()}
function recipeForm(){let name=prompt('Name des Rezepts:');if(!name)return;let ingredients=prompt('Zutaten mit Mengen (durch Kommas trennen):','');if(ingredients===null)return;let preparation=prompt('Zubereitung:', '');if(preparation===null)return;let kcal=promptNum('Kalorien pro Portion (kcal):');if(kcal===null)return;let r={name,ingredients,preparation,kcal,img:''};db.customRecipes.push(r);save();if(confirm('Möchtest du ein Bild zum Rezept hinzufügen?'))recipeImage(db.customRecipes.length-1)}
function recipeImage(i){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{let file=inp.files?.[0];if(!file)return;if(file.size>1800000)return alert('Bitte ein kleineres Bild verwenden (unter 1.8 MB).');let rd=new FileReader();rd.onload=()=>{db.customRecipes[i].img=rd.result;try{save()}catch(e){alert('Bild zu gross für den lokalen Speicher.')}};rd.readAsDataURL(file)};inp.click()}
function customRecipeCards(){return `<h3>Meine Rezepte</h3>${db.customRecipes.map((r,i)=>`<div class="foodcard">${r.img?`<img src="${r.img}" alt="Rezeptbild">`:'<span style="font-size:42px">🥗</span>'}<div class="desc"><b>${esc(r.name)}</b><p>${esc(r.ingredients)}</p><small>${r.kcal} kcal pro Portion</small><div class="row"><button class="secondary" onclick="showRecipe(${i})">Details</button><button class="secondary" onclick="useCustomRecipe(${i})">Eintragen</button><button class="secondary" onclick="editRecipe(${i})">✎</button><button class="secondary" onclick="recipeImage(${i})">📷</button></div></div></div>`).join('')||'<p class="smallnote">Noch keine eigenen Rezepte.</p>'}`}
function editRecipe(i){let r=db.customRecipes[i];let name=prompt("Rezeptname:",r.name);if(name===null)return;let ingredients=prompt("Zutaten:",r.ingredients);if(ingredients===null)return;let preparation=prompt("Zubereitung:",r.preparation);if(preparation===null)return;let kcal=promptNum("Neue Kalorien pro Portion (bisher "+r.kcal+"):");if(kcal===null)return;Object.assign(r,{name,ingredients,preparation,kcal});save()}
function showRecipe(i){let r=db.customRecipes[i];alert(r.name+'\n\nZutaten: '+r.ingredients+'\n\nZubereitung: '+r.preparation)}
function useCustomRecipe(i){let r=db.customRecipes[i];db.foods.push({date:state.day,name:r.name,kcal:r.kcal,meal:state.meal||'Snacks'});save()}

render();
</script></body></html>
